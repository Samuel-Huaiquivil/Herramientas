{% extends "base.html" %}
{% block title %}Ingresar{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:3rem auto">
  <h2>Ingresar</h2>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn" type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
